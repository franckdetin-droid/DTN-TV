services:
  vision_tv:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./media_storage_2tb:/app/media_storage_2tb
      - ./channels_db.json:/app/channels_db.json
      - ./storage_data:/app/storage_data
    environment:
      PORT: 3000
      ADMIN_PIN: "3004"
      SECRET_KEY: "change-me"
      DATABASE_URL: "sqlite:////app/storage_data/storage.sqlite3"
      STORAGE_BACKEND: "local"
      STORAGE_CAPACITY_GB: "2048"
    restart: always
