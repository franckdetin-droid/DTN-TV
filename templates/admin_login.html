{% extends "base.html" %}
{% block title %}Administration sécurisée — ProxiService{% endblock %}
{% block content %}
<section class="form-page"><div class="form-card compact">
<span class="eyebrow">ESPACE ADMINISTRATEUR</span>
<h1>Accès sécurisé</h1>
<p>Saisissez le code administrateur pour continuer.</p>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" class="form-grid" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Code administrateur<input type="password" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="32" required autofocus autocomplete="off" placeholder="Entrez votre code"></label>
<button class="btn primary full" type="submit">Ouvrir l’administration</button>
</form>
</div></section>
{% endblock %}
