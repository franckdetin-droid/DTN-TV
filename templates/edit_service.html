{% extends "base.html" %}{% block title %}Modifier une prestation — ProxiService{% endblock %}{% block content %}<div class="form-page"><div class="form-card"><span class="eyebrow">ESPACE PROFESSIONNEL</span><h1>Modifier la prestation</h1><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Titre *<input name="title" value="{{ service['title'] }}" required maxlength="150"></label><label>Catégorie *<input name="category" value="{{ service['category'] }}" required maxlength="100"></label><label>Description<textarea name="description" rows="5" maxlength="3000">{{ service['description'] or '' }}</textarea></label><label>Prix<input name="price" value="{{ service['price'] or '' }}" maxlength="100"></label><label>Ville *<input name="city" value="{{ service['city'] }}" required maxlength="100"></label><label>Quartier<input name="neighborhood" value="{{ service['neighborhood'] or '' }}" maxlength="100"></label><label>Changer la photo (facultatif)<input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"></label>{% if service['image'] %}<img class="profile-photo" src="{{ url_for('static',filename='uploads/'+service['image']) }}" alt="Photo actuelle">{% endif %}<button class="btn primary" type="submit">Enregistrer les modifications</button></form></div></div>{% endblock %}
