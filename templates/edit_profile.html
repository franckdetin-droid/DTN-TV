{% extends "base.html" %}{% block title %}Modifier mon profil — ProxiService{% endblock %}{% block content %}<div class="form-page"><div class="form-card"><h1>Modifier mon profil professionnel</h1><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Photo de profil<input type="file" name="profile_photo" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>Métier ou spécialité<input name="profession" maxlength="100" value="{{ user['profession'] or '' }}"></label><label>Présentation<textarea name="bio" rows="5" maxlength="2000">{{ user['bio'] or '' }}</textarea></label><button class="btn primary" type="submit">Enregistrer le profil</button></form></div></div>{% endblock %}
