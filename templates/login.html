{% extends "base.html" %}{% block title %}Connexion — ProxiService{% endblock %}
{% block content %}<div class="form-page"><div class="form-card compact"><span class="eyebrow">ESPACE SÉCURISÉ</span><h1>Bon retour.</h1><p>Connectez-vous pour gérer vos services ou administrer la plateforme.</p>
<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>E-mail<input type="email" name="email" required autocomplete="username"></label><label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary full" type="submit">Se connecter</button></form><p class="form-foot">Professionnel ? <a href="{{ url_for('register') }}">Créer un espace</a></p></div></div>{% endblock %}
